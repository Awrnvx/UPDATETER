<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Созвездия из частиц</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: #0a0a1a;
    font-family: 'Segoe UI', sans-serif;
    color: #fff;
    cursor: crosshair;
  }
  canvas#bg { display: block; position: fixed; inset: 0; z-index: 0; }

  .info {
    position: fixed; top: 20px; left: 20px;
    color: rgba(255, 255, 255, 0.5);
    font-size: 13px; pointer-events: none; user-select: none;
    letter-spacing: 1px; z-index: 5;
  }
  .info b { color: #6cf; }

  .balance {
    position: fixed; top: 20px; right: 20px;
    font-size: 26px; font-weight: 800;
    color: #ffd54a;
    text-shadow: 0 0 20px rgba(255, 200, 60, 0.8);
    user-select: none; pointer-events: none;
    transition: transform 0.15s; z-index: 5;
  }
  .balance.pop { transform: scale(1.2); }

  .stats {
    position: fixed; top: 60px; right: 20px;
    font-size: 12px; color: rgba(180, 220, 255, 0.7);
    text-align: right; user-select: none; pointer-events: none;
    z-index: 5; line-height: 1.5;
  }
  .stats b { color: #6cf; }

  /* ====== НИЖНЯЯ ПАНЕЛЬ УПРАВЛЕНИЯ ====== */
  .dock {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    pointer-events: none;
  }
  .dock > * { pointer-events: auto; }

  /* Основные кнопки */
  .dock-row {
    display: flex;
    gap: 8px;
    padding: 8px;
    background: rgba(12, 16, 32, 0.75);
    border: 1px solid rgba(120, 180, 255, 0.2);
    border-radius: 18px;
    backdrop-filter: blur(20px);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 12px 16px;
    border: none;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
    user-select: none;
    white-space: nowrap;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.94); }

  .btn .icon { font-size: 16px; line-height: 1; }

  @media (max-width: 640px) {
    .btn .label { display: none; }
    .btn { padding: 12px 14px; }
    .btn .icon { font-size: 20px; }
  }

  .btn-balls {
    background: linear-gradient(135deg, #3a7bff, #6cf);
    box-shadow: 0 0 15px rgba(100, 180, 255, 0.5);
  }
  .btn-balls:hover { box-shadow: 0 0 25px rgba(100, 180, 255, 0.9); }

  .btn-money {
    background: linear-gradient(135deg, #f7b733, #fc4a1a);
    box-shadow: 0 0 15px rgba(255, 180, 60, 0.5);
  }
  .btn-money:hover { box-shadow: 0 0 25px rgba(255, 180, 60, 0.9); }

  .btn-spin {
    background: linear-gradient(135deg, #8e2de2, #4a00e0);
    box-shadow: 0 0 15px rgba(150, 80, 255, 0.6);
  }
  .btn-spin:hover { box-shadow: 0 0 25px rgba(180, 120, 255, 1); }

  .btn-shop {
    background: linear-gradient(135deg, #0aa5b8, #4cf0ff);
    color: #06222a;
    box-shadow: 0 0 15px rgba(80, 220, 255, 0.6);
  }
  .btn-shop:hover { box-shadow: 0 0 25px rgba(120, 240, 255, 1); }

  .btn-settings {
    background: rgba(60, 70, 120, 0.6);
    border: 1px solid rgba(120, 180, 255, 0.3);
  }
  .btn-settings:hover { background: rgba(80, 90, 150, 0.8); }
  .btn-settings.active {
    background: linear-gradient(135deg, #4cf0ff, #a060ff);
    color: #06222a;
    box-shadow: 0 0 25px rgba(120, 200, 255, 0.7);
  }

  /* ====== РАЗВОРАЧИВАЮЩАЯСЯ ПАНЕЛЬ НАСТРОЕК ====== */
  .settings-drawer {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
    opacity: 0;
    width: 100%;
    max-width: 720px;
  }
  .settings-drawer.open {
    max-height: 500px;
    opacity: 1;
  }

  .settings-content {
    background: rgba(12, 16, 32, 0.9);
    border: 1px solid rgba(120, 180, 255, 0.25);
    border-radius: 18px;
    backdrop-filter: blur(20px);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    padding: 16px 20px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px 20px;
  }
  @media (max-width: 640px) {
    .settings-content { grid-template-columns: 1fr; padding: 14px; }
  }

  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 6px 0;
    font-size: 13px;
  }
  .setting-row label {
    color: rgba(200, 220, 255, 0.85);
    flex-shrink: 0;
    min-width: 130px;
  }
  .setting-row .val {
    color: #4cf0ff;
    font-weight: 700;
    font-size: 12px;
    min-width: 36px;
    text-align: right;
  }
  .setting-row input[type="range"] {
    flex: 1;
    accent-color: #4cf0ff;
    cursor: pointer;
    height: 4px;
  }

  .toggle {
    position: relative;
    width: 42px; height: 22px;
    background: rgba(80, 80, 100, 0.6);
    border-radius: 11px;
    cursor: pointer;
    transition: background 0.25s;
    flex-shrink: 0;
  }
  .toggle::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 18px; height: 18px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.25s;
  }
  .toggle.on {
    background: linear-gradient(90deg, #0aa5b8, #4cf0ff);
  }
  .toggle.on::after { transform: translateX(20px); }

  .divider {
    grid-column: 1 / -1;
    height: 1px;
    background: rgba(120, 180, 255, 0.15);
    margin: 4px 0;
  }

  .check-update-row {
    grid-column: 1 / -1;
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }
  .check-update-row .btn {
    flex: 1;
    background: linear-gradient(135deg, #0aa5b8, #4cf0ff);
    color: #06222a;
    padding: 12px;
  }
  .check-update-row .btn:hover {
    box-shadow: 0 0 25px rgba(120, 240, 255, 1);
  }
  .check-update-row .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    background: rgba(80, 80, 100, 0.5);
    color: rgba(255,255,255,0.5);
  }

  .version-tag {
    font-size: 11px;
    color: rgba(180, 210, 255, 0.5);
    text-align: center;
    letter-spacing: 1px;
    padding-top: 4px;
  }

  .floater {
    position: fixed; font-weight: 800; font-size: 20px;
    pointer-events: none; user-select: none;
    animation: floatUp 1.4s ease-out forwards;
    z-index: 25; text-shadow: 0 0 12px currentColor;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) scale(0.8); opacity: 0; }
    20%  { transform: translateY(-15px) scale(1.2); opacity: 1; }
    100% { transform: translateY(-100px) scale(1); opacity: 0; }
  }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(5, 5, 20, 0.85);
    backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 20px;
    z-index: 100; opacity: 0; transition: opacity 0.3s;
    padding: 20px; box-sizing: border-box;
  }
  .overlay.show { display: flex; opacity: 1; }

  .close-btn {
    position: absolute; top: 20px; right: 20px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff; width: 44px; height: 44px;
    border-radius: 50%; font-size: 22px;
    cursor: pointer; font-weight: 700; z-index: 5;
  }
  .close-btn:hover { background: rgba(255,255,255,0.2); }

  /* === Модалка обновления === */
  .update-modal {
    background: rgba(15, 20, 40, 0.98);
    border: 1px solid rgba(120, 180, 255, 0.4);
    border-radius: 20px;
    padding: 30px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 60px rgba(80, 150, 255, 0.4);
  }
  .update-modal h3 {
    margin: 0 0 16px 0;
    font-size: 22px;
    color: #4cf0ff;
    letter-spacing: 1px;
  }
  .update-modal p {
    margin: 8px 0;
    color: rgba(200, 220, 255, 0.8);
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-line;
  }
  .update-modal .version-info {
    background: rgba(80, 220, 255, 0.1);
    padding: 12px;
    border-radius: 10px;
    margin: 16px 0;
    font-size: 13px;
  }
  .update-modal .version-info b { color: #4cf0ff; }
  .update-modal .buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .update-modal .buttons button {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn-download {
    background: linear-gradient(135deg, #0aa5b8, #4cf0ff);
    color: #06222a;
    box-shadow: 0 0 20px rgba(80, 220, 255, 0.5);
  }
  .btn-download:hover { box-shadow: 0 0 35px rgba(120, 240, 255, 0.9); }
  .btn-skip {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2) !important;
  }
  .btn-skip:hover { background: rgba(255,255,255,0.2); }

  /* === Рулетка === */
  .wheel-wrap {
    position: relative; width: 420px; height: 420px;
    filter: drop-shadow(0 0 40px rgba(120, 180, 255, 0.5));
  }
  @media (max-width: 500px) { .wheel-wrap { width: 300px; height: 300px; } }
  canvas#wheel {
    width: 100%; height: 100%;
    transition: transform 4.5s cubic-bezier(0.15, 0.9, 0.25, 1);
  }
  .pointer {
    position: absolute; top: -14px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 32px solid #ffd54a;
    filter: drop-shadow(0 0 10px rgba(255,200,60,0.9));
    z-index: 5;
  }
  .center-btn {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 90px; height: 90px; border-radius: 50%;
    border: 3px solid #ffd54a;
    background: radial-gradient(circle at 30% 30%, #2a3a6a, #0f1730);
    color: #ffd54a; font-weight: 800; font-size: 14px;
    letter-spacing: 1px; cursor: pointer;
    box-shadow: 0 0 25px rgba(255,200,60,0.6), inset 0 0 20px rgba(120,180,255,0.3);
    transition: transform 0.15s, box-shadow 0.3s; z-index: 4;
  }
  .center-btn:hover { box-shadow: 0 0 40px rgba(255,200,60,0.9); }
  .center-btn:active { transform: translate(-50%, -50%) scale(0.92); }
  .center-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .bets {
    display: flex; gap: 12px;
    background: rgba(20, 25, 50, 0.6);
    border: 1px solid rgba(120, 180, 255, 0.3);
    backdrop-filter: blur(10px);
    padding: 10px; border-radius: 16px;
    flex-wrap: wrap; justify-content: center;
  }
  .bet-btn {
    padding: 10px 22px; border-radius: 10px;
    border: 1px solid rgba(120, 180, 255, 0.4);
    background: rgba(40, 60, 120, 0.4);
    color: #cfe4ff; font-weight: 700; cursor: pointer;
    transition: all 0.2s;
  }
  .bet-btn.active {
    background: linear-gradient(135deg, #3a7bff, #6cf);
    color: #fff; border-color: #6cf;
    box-shadow: 0 0 20px rgba(100,180,255,0.7);
  }

  .result {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 60px; font-weight: 900;
    text-shadow: 0 0 40px currentColor;
    pointer-events: none; opacity: 0; z-index: 200;
  }
  .result.show { animation: resultPop 1.5s ease-out forwards; }
  @keyframes resultPop {
    0%   { transform: translate(-50%,-50%) scale(0) rotate(-20deg); opacity: 0; }
    20%  { transform: translate(-50%,-50%) scale(1.4) rotate(5deg); opacity: 1; }
    40%  { transform: translate(-50%,-50%) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(-50%,-120%) scale(1); opacity: 0; }
  }

  .shop-title {
    font-size: 32px; font-weight: 800; letter-spacing: 3px;
    background: linear-gradient(90deg, #4cf0ff, #a060ff, #ffd54a);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; margin: 0 0 10px 0; text-align: center;
  }
  .shop-sub {
    color: rgba(200, 220, 255, 0.6);
    font-size: 14px; margin-bottom: 20px; text-align: center;
  }
  .shop-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px; max-width: 1000px; width: 100%;
    max-height: 65vh; overflow-y: auto;
    padding: 6px; box-sizing: border-box;
  }
  .shop-grid::-webkit-scrollbar { width: 8px; }
  .shop-grid::-webkit-scrollbar-thumb {
    background: rgba(120, 180, 255, 0.4); border-radius: 4px;
  }

  .card {
    background: rgba(15, 20, 40, 0.85);
    border: 1px solid rgba(120, 180, 255, 0.25);
    border-radius: 16px; padding: 18px;
    display: flex; flex-direction: column; gap: 8px;
    position: relative;
    transition: transform 0.2s, box-shadow 0.3s, border-color 0.3s;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(120, 180, 255, 0.6);
    box-shadow: 0 0 30px rgba(80, 150, 255, 0.3);
  }
  .card.owned {
    border-color: rgba(255, 200, 60, 0.7);
    box-shadow: 0 0 25px rgba(255, 200, 60, 0.3);
  }
  .card.owned::after {
    content: '✓ НА НЕБЕ';
    position: absolute; top: 10px; right: 10px;
    font-size: 10px;
    background: rgba(255, 200, 60, 0.2);
    color: #ffd54a; padding: 3px 8px; border-radius: 6px;
    font-weight: 700; letter-spacing: 1px;
  }
  .card-preview {
    height: 100px;
    background: radial-gradient(ellipse at center, rgba(30,40,80,0.6), rgba(5,5,20,0.9));
    border-radius: 10px;
    border: 1px solid rgba(120, 180, 255, 0.2);
    position: relative;
    overflow: hidden;
  }
  .card-preview canvas {
    width: 100%; height: 100%; display: block;
  }
  .card-name {
    font-size: 17px; font-weight: 700; text-align: center;
    letter-spacing: 1px;
  }
  .card-latin {
    font-size: 11px; text-align: center;
    color: rgba(180, 210, 255, 0.5);
    font-style: italic; letter-spacing: 1px;
  }
  .card-desc {
    font-size: 12px; color: rgba(180, 210, 255, 0.7);
    text-align: center; line-height: 1.5; flex: 1;
  }
  .card-bonus {
    font-size: 12px; text-align: center;
    color: #4cf0ff; font-weight: 700;
    padding: 4px 8px;
    background: rgba(80, 220, 255, 0.1);
    border-radius: 6px;
  }
  .card-price {
    font-size: 20px; font-weight: 800; text-align: center;
    color: #ffd54a;
    text-shadow: 0 0 12px rgba(255, 200, 60, 0.6);
  }
  .buy-btn {
    padding: 10px; border: none; border-radius: 10px;
    font-weight: 700; cursor: pointer;
    letter-spacing: 1px; font-size: 14px;
    background: linear-gradient(135deg, #3a7bff, #6cf);
    color: #fff; transition: all 0.2s;
    box-shadow: 0 0 15px rgba(100,180,255,0.5);
  }
  .buy-btn:hover:not(:disabled) {
    box-shadow: 0 0 30px rgba(100,180,255,0.9);
    transform: translateY(-2px);
  }
  .buy-btn:disabled {
    background: rgba(80, 80, 100, 0.5);
    cursor: not-allowed; box-shadow: none; opacity: 0.6;
  }
  .buy-btn.owned-btn {
    background: rgba(255, 200, 60, 0.2);
    color: #ffd54a; cursor: default; box-shadow: none;
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="info">Двигай мышью — <b>частицы</b> собираются в созвездия</div>
<div class="balance" id="balance">$1000</div>
<div class="stats" id="stats"></div>

<!-- ====== НИЖНИЙ ДОК ====== -->
<div class="dock">
  <!-- Разворачивающиеся настройки -->
  <div class="settings-drawer" id="settingsDrawer">
    <div class="settings-content">
      <div class="setting-row">
        <label>Частиц</label>
        <input type="range" id="sParticles" min="100" max="1500" step="50" value="550">
        <span class="val" id="sParticlesVal">550</span>
      </div>
      <div class="setting-row">
        <label>Скорость</label>
        <input type="range" id="sSpeed" min="0.3" max="3" step="0.1" value="1">
        <span class="val" id="sSpeedVal">1.0</span>
      </div>
      <div class="setting-row">
        <label>Свечение</label>
        <input type="range" id="sGlow" min="0.5" max="3" step="0.1" value="1">
        <span class="val" id="sGlowVal">1.0</span>
      </div>
      <div class="setting-row">
        <label>Притяжение</label>
        <input type="range" id="sMagnet" min="0.5" max="4" step="0.1" value="1">
        <span class="val" id="sMagnetVal">1.0</span>
      </div>

      <div class="divider"></div>

      <div class="setting-row">
        <label>Линии связи</label>
        <div class="toggle on" id="sLines"></div>
      </div>
      <div class="setting-row">
        <label>След частиц</label>
        <div class="toggle" id="sTrail"></div>
      </div>
      <div class="setting-row">
        <label>Дрейф созвездий</label>
        <div class="toggle on" id="sDrift"></div>
      </div>
      <div class="setting-row">
        <label>Притяжение к мыши</label>
        <div class="toggle on" id="sMouse"></div>
      </div>

      <div class="divider"></div>

      <div class="check-update-row">
        <button class="btn" id="checkUpdates">
          <span class="icon">🔄</span>
          <span class="label">Проверить обновления</span>
        </button>
      </div>
      <div class="version-tag">Версия <span id="currentVersion">1.0.0</span></div>
    </div>
  </div>

  <!-- Кнопки -->
  <div class="dock-row">
    <button class="btn btn-balls" id="ballsBtn">
      <span class="icon">🔵</span>
      <span class="label">Шарики</span>
    </button>
    <button class="btn btn-money" id="moneyBtn">
      <span class="icon">💰</span>
      <span class="label">Деньги</span>
    </button>
    <button class="btn btn-spin" id="openRoulette">
      <span class="icon">🎡</span>
      <span class="label">Рулетка</span>
    </button>
    <button class="btn btn-shop" id="openShop">
      <span class="icon">✨</span>
      <span class="label">Магазин</span>
    </button>
    <button class="btn btn-settings" id="toggleSettings">
      <span class="icon">⚙️</span>
      <span class="label">Настройки</span>
    </button>
  </div>
</div>

<!-- Модалка обновления -->
<div class="overlay" id="updateOverlay">
  <button class="close-btn" id="closeUpdate">✕</button>
  <div class="update-modal" id="updateModalContent"></div>
</div>

<!-- Рулетка -->
<div class="overlay" id="rouletteOverlay">
  <button class="close-btn" id="closeRoulette">✕</button>
  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="420" height="420"></canvas>
    <button class="center-btn" id="spinBtn">КРУТИТЬ</button>
  </div>
  <div class="bets">
    <button class="bet-btn" data-bet="10">$10</button>
    <button class="bet-btn active" data-bet="100">$100</button>
    <button class="bet-btn" data-bet="500">$500</button>
    <button class="bet-btn" data-bet="1000">$1000</button>
  </div>
</div>

<!-- Магазин -->
<div class="overlay" id="shopOverlay">
  <button class="close-btn" id="closeShop">✕</button>
  <h1 class="shop-title">✨ МАГАЗИН СОЗВЕЗДИЙ ✨</h1>
  <div class="shop-sub">Покупай настоящие созвездия — они появятся на небе и дадут бонусы</div>
  <div class="shop-grid" id="shopGrid"></div>
</div>

<div class="result" id="result"></div>

<script>
/* ================== КОНФИГ ================== */
const CONFIG = {
  currentVersion: '1.0.0',
  updateUrl: 'update.json',
};

/* ================== ФОН ================== */
const bg = document.getElementById('bg');
const ctx = bg.getContext('2d');
let W, H;
function resize() { W = bg.width = innerWidth; H = bg.height = innerHeight; }
resize(); addEventListener('resize', resize);

const mouse = { x: W/2, y: H/2, active: false };
addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
addEventListener('mouseleave', () => mouse.active = false);
addEventListener('touchmove', e => {
  const t = e.touches[0];
  mouse.x = t.clientX; mouse.y = t.clientY; mouse.active = true;
}, { passive: true });

/* ================== ЧАСТИЦЫ ================== */
class Particle {
  constructor(x, y, burst = false, hue) {
    this.x = x ?? Math.random() * W;
    this.y = y ?? Math.random() * H;
    const a = Math.random() * Math.PI * 2;
    const s = burst ? Math.random() * 8 + 2 : Math.random() * 0.5;
    this.vx = Math.cos(a) * s;
    this.vy = Math.sin(a) * s;
    this.size = Math.random() * 2 + 1;
    this.hue = hue ?? (Math.random() * 60 + 180);
    this.trail = [];
    this.target = null;
    this.targetStrength = 0;
    this.constellationId = null;
    this.wobblePhase = Math.random() * Math.PI * 2;
    this.baseSize = this.size;
    this.isStar = false;
  }

  update() {
    const speedBoost = visual.speedBoost * settings.speed;
    const magnetBoost = visual.magnetBoost * settings.magnet;

    if (this.target) {
      const dx = this.target.x - this.x;
      const dy = this.target.y - this.y;
      const k = 0.035 * this.targetStrength;
      this.vx += dx * k;
      this.vy += dy * k;
      this.vx *= 0.85;
      this.vy *= 0.85;
    }

    if (!this.target) {
      for (const c of constellationObjects) {
        if (c.appearProgress < 0.5) continue;
        const dx = this.x - c.x;
        const dy = this.y - c.y;
        const dist = Math.sqrt(dx*dx + dy*dy) + 0.001;
        const repelRadius = 50;
        if (dist < repelRadius) {
          const force = (1 - dist / repelRadius) * 0.15;
          this.vx += (dx / dist) * force;
          this.vy += (dy / dist) * force;
        }
      }
    }

    if (!this.target && mouse.active && settings.mouseAttract) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx*dx + dy*dy) + 0.001;
      const force = Math.min(200 / (dist * dist), 0.5) * magnetBoost;
      this.vx += (dx / dist) * force * 0.8;
      this.vy += (dy / dist) * force * 0.8;
      if (dist < 40) {
        this.vx -= (dx / dist) * 0.3;
        this.vy -= (dy / dist) * 0.3;
      }
      this.vx *= 0.96;
      this.vy *= 0.96;
      this.vx += (Math.random() - 0.5) * 0.15 * speedBoost;
      this.vy += (Math.random() - 0.5) * 0.15 * speedBoost;
    } else if (!this.target) {
      this.vx *= 0.96;
      this.vy *= 0.96;
      this.vx += (Math.random() - 0.5) * 0.15 * speedBoost;
      this.vy += (Math.random() - 0.5) * 0.15 * speedBoost;
    }

    this.x += this.vx * speedBoost;
    this.y += this.vy * speedBoost;

    if (!this.target) {
      if (this.x < -10) this.x = W + 10;
      if (this.x > W + 10) this.x = -10;
      if (this.y < -10) this.y = H + 10;
      if (this.y > H + 10) this.y = -10;
    }

    if (settings.trail || visual.trail) {
      this.trail.push({ x: this.x, y: this.y });
      if (this.trail.length > 6) this.trail.shift();
    } else {
      this.trail.length = 0;
    }
  }

  getHue() {
    if (this.constellationId) {
      const c = CONSTELLATIONS.find(x => x.id === this.constellationId);
      if (c) return hexToHue(c.color);
    }
    if (visual.hueOverride !== null) return visual.hueOverride + (this.hue - 210) * 0.1;
    return this.hue;
  }

  draw() {
    const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
    const isStar = this.isStar;
    const glowBase = settings.glow * visual.glowBoost;
    const glow = Math.min(speed * 3, 15) * glowBase + (isStar ? 8 : 0);
    const alpha = Math.min(0.3 + speed * 0.5, 1);
    const hue = this.getHue();
    const light = 60 + speed * 5 + (isStar ? 25 : 0);
    const size = this.baseSize * (isStar ? 1.6 : 1);

    if ((settings.trail || visual.trail) && this.trail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.trail[0].x, this.trail[0].y);
      for (let i = 1; i < this.trail.length; i++) ctx.lineTo(this.trail[i].x, this.trail[i].y);
      ctx.lineTo(this.x, this.y);
      ctx.strokeStyle = `hsla(${hue}, 90%, ${light}%, ${alpha * 0.4})`;
      ctx.lineWidth = size * 0.8;
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${hue}, 90%, ${light}%, ${alpha})`;
    ctx.shadowBlur = glow;
    ctx.shadowColor = `hsla(${hue}, 100%, 70%, 0.8)`;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

let particles = [];

function createParticles() {
  particles = Array.from({ length: settings.particleCount }, () => new Particle());
}

/* ================== СОЗВЕЗДИЯ ИЗ ЧАСТИЦ ================== */
class ParticleConstellation {
  constructor(data) {
    this.data = data;
    this.x = W / 2;
    this.y = H / 2;
    this.driftX = (Math.random() - 0.5) * 0.06;
    this.driftY = (Math.random() - 0.5) * 0.06;
    this.rotation = (Math.random() - 0.5) * 0.3;
    this.appearProgress = 0;
    this.time = 0;
    this.particles = [];
    this.findGoodPosition();
  }

  findGoodPosition() {
    const pad = this.data.size / 2 + 80;
    let bestX = W / 2, bestY = H / 2, bestDist = -1;
    for (let attempt = 0; attempt < 30; attempt++) {
      const x = Math.random() * (W - pad * 2) + pad;
      const y = Math.random() * (H - pad * 2) + pad;
      let minDist = Infinity;
      for (const c of constellationObjects) {
        const d = Math.hypot(c.x - x, c.y - y);
        if (d < minDist) minDist = d;
      }
      if (minDist > bestDist) { bestDist = minDist; bestX = x; bestY = y; }
      if (minDist > this.data.size * 1.2) break;
    }
    this.x = bestX;
    this.y = bestY;
  }

  update() {
    this.time += 0.016;
    if (settings.drift) {
      this.x += this.driftX;
      this.y += this.driftY;
    }

    const pad = this.data.size / 2 + 60;
    if (this.x < pad) this.driftX = Math.abs(this.driftX);
    if (this.x > W - pad) this.driftX = -Math.abs(this.driftX);
    if (this.y < pad) this.driftY = Math.abs(this.driftY);
    if (this.y > H - pad) this.driftY = -Math.abs(this.driftY);

    for (const other of constellationObjects) {
      if (other === this) continue;
      const dx = this.x - other.x;
      const dy = this.y - other.y;
      const dist = Math.hypot(dx, dy) + 0.001;
      const minDist = (this.data.size + other.data.size) * 0.5;
      if (dist < minDist) {
        const push = (minDist - dist) * 0.002;
        this.x += (dx / dist) * push;
        this.y += (dy / dist) * push;
      }
    }

    if (this.appearProgress < 1) this.appearProgress = Math.min(1, this.appearProgress + 0.02);
  }

  updateTargets() {
    const d = this.data;
    const size = d.size;
    const cx = this.x;
    const cy = this.y;
    const cos = Math.cos(this.rotation);
    const sin = Math.sin(this.rotation);
    const breathe = 1 + Math.sin(this.time * 0.7) * 0.025;

    const targets = [];

    for (const s of d.stars) {
      for (let i = 0; i < 3; i++) {
        const sx = (s.x - 0.5) * size * breathe;
        const sy = (s.y - 0.5) * size * breathe;
        const rx = sx * cos - sy * sin;
        const ry = sx * sin + sy * cos;
        const offset = i === 0 ? 0 : (Math.random() - 0.5) * 8;
        targets.push({ x: cx + rx + offset, y: cy + ry + offset, isStar: i === 0 });
      }
    }

    for (const [a, b] of d.links) {
      const s1 = d.stars[a], s2 = d.stars[b];
      const x1 = (s1.x - 0.5) * size * breathe;
      const y1 = (s1.y - 0.5) * size * breathe;
      const x2 = (s2.x - 0.5) * size * breathe;
      const y2 = (s2.y - 0.5) * size * breathe;
      const len = Math.hypot(x2 - x1, y2 - y1);
      const count = len > 100 ? 4 : 3;
      for (let i = 1; i < count; i++) {
        const t = i / count;
        const lx = x1 + (x2 - x1) * t;
        const ly = y1 + (y2 - y1) * t;
        const rx = lx * cos - ly * sin;
        const ry = lx * sin + ly * cos;
        targets.push({ x: cx + rx + (Math.random() - 0.5) * 4, y: cy + ry + (Math.random() - 0.5) * 4, isStar: false });
      }
    }

    while (this.particles.length < targets.length) {
      const p = new Particle(
        cx + (Math.random() - 0.5) * 300,
        cy + (Math.random() - 0.5) * 300,
        false,
        hexToHue(d.color)
      );
      p.targetStrength = 1;
      p.constellationId = d.id;
      p.baseSize = 1.4 + Math.random() * 0.8;
      particles.push(p);
      this.particles.push(p);
    }

    while (this.particles.length > targets.length) {
      const p = this.particles.pop();
      p.target = null;
      p.constellationId = null;
      p.targetStrength = 0;
    }

    for (let i = 0; i < this.particles.length; i++) {
      const p = this.particles[i];
      const t = targets[i];
      p.wobblePhase += 0.015 + Math.random() * 0.01;
      const isStar = t.isStar;
      p.target = {
        x: t.x + Math.cos(p.wobblePhase) * (isStar ? 1.5 : 1),
        y: t.y + Math.sin(p.wobblePhase * 1.5) * (isStar ? 1.5 : 1),
      };
      p.isStar = isStar;
      p.baseSize = isStar ? 2.4 + Math.random() * 0.8 : 1.3 + Math.random() * 0.5;
    }
  }
}

const coins = [];
class Coin {
  constructor(x, y) {
    this.x = x ?? Math.random() * W;
    this.y = y ?? -20 - Math.random() * 200;
    this.vx = (Math.random() - 0.5) * 3;
    this.vy = Math.random() * 2 + 1.5;
    this.r = Math.random() * 6 + 5;
    this.rot = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random() - 0.5) * 0.2;
    this.wobble = Math.random() * Math.PI * 2;
  }
  update() {
    this.wobble += 0.1;
    this.vy += 0.15;
    this.x += this.vx + Math.sin(this.wobble) * 0.5;
    this.y += this.vy;
    this.rot += this.rotSpeed;
    return this.y < H + 40;
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.shadowBlur = 15;
    ctx.shadowColor = 'rgba(255, 200, 50, 0.9)';
    const grad = ctx.createRadialGradient(-this.r*0.3, -this.r*0.3, 1, 0, 0, this.r);
    grad.addColorStop(0, '#fff3b0');
    grad.addColorStop(0.5, '#ffd54a');
    grad.addColorStop(1, '#c98a10');
    ctx.beginPath();
    ctx.arc(0, 0, this.r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#8a5a00';
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#8a5a00';
    ctx.font = `bold ${this.r * 1.4}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('$', 0, 1);
    ctx.restore();
  }
}

/* ================== Главный цикл ================== */
function loop() {
  ctx.fillStyle = 'rgba(10, 10, 26, 0.15)';
  ctx.fillRect(0, 0, W, H);

  for (const c of constellationObjects) {
    c.update();
    c.updateTargets();
  }

  if (settings.lines) {
    const linkDist = visual.linkDist;
    ctx.lineWidth = 0.4;
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const a = particles[i];
        const b = particles[j];
        if (a.constellationId && b.constellationId && a.constellationId !== b.constellationId) continue;
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const d2 = dx*dx + dy*dy;
        if (d2 < linkDist) {
          if (a.constellationId && a.constellationId === b.constellationId) {
            if (d2 > 60 * 60) continue;
            const c = CONSTELLATIONS.find(x => x.id === a.constellationId);
            const opacity = (1 - d2 / (60 * 60)) * 0.7;
            ctx.strokeStyle = `hsla(${hexToHue(c.color)}, 90%, 78%, ${opacity})`;
            ctx.lineWidth = 0.9;
          } else if (!a.constellationId && !b.constellationId) {
            const opacity = (1 - d2 / linkDist) * 0.25;
            if (visual.hueOverride !== null) {
              ctx.strokeStyle = `hsla(${visual.hueOverride}, 90%, 70%, ${opacity})`;
            } else {
              ctx.strokeStyle = `rgba(100, 180, 255, ${opacity})`;
            }
            ctx.lineWidth = 0.4;
          } else {
            continue;
          }
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }
  }

  for (const p of particles) { p.update(); p.draw(); }

  for (let i = coins.length - 1; i >= 0; i--) {
    if (coins[i].update()) coins[i].draw();
    else coins.splice(i, 1);
  }

  if (mouse.active) {
    const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 100);
    g.addColorStop(0, 'rgba(120, 200, 255, 0.25)');
    g.addColorStop(1, 'rgba(120, 200, 255, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 100, 0, Math.PI * 2);
    ctx.fill();
  }

  requestAnimationFrame(loop);
}
loop();

function floater(text, color) {
  const el = document.createElement('div');
  el.className = 'floater';
  el.textContent = text;
  el.style.color = color;
  el.style.left = (innerWidth / 2 - 40) + 'px';
  el.style.top = (innerHeight / 2 + 60) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1400);
}

function hexToHue(hex) {
  const r = parseInt(hex.slice(1,3), 16) / 255;
  const g = parseInt(hex.slice(3,5), 16) / 255;
  const b = parseInt(hex.slice(5,7), 16) / 255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h = 0;
  if (max === min) h = 0;
  else if (max === r) h = 60 * (((g - b) / (max - min)) % 6);
  else if (max === g) h = 60 * ((b - r) / (max - min) + 2);
  else h = 60 * ((r - g) / (max - min) + 4);
  return h < 0 ? h + 360 : h;
}

sParticles.addEventListener('input', e => {
  settings.particleCount = +e.target.value;
  sParticlesVal.textContent = settings.particleCount;
  const freeCount = particles.filter(p => !p.target).length;
  const diff = settings.particleCount - freeCount;
  if (diff > 0) {
    for (let i = 0; i < diff; i++) particles.push(new Particle());
  } else if (diff < 0) {
    let toRemove = -diff;
    for (let i = particles.length - 1; i >= 0 && toRemove > 0; i--) {
      if (!particles[i].target) { particles.splice(i, 1); toRemove--; }
    }
  }
});
sSpeed.addEventListener('input', e => {
  settings.speed = +e.target.value;
  sSpeedVal.textContent = settings.speed.toFixed(1);
});
sGlow.addEventListener('input', e => {

});
sMagnet.addEventListener('input', e => {

});

/* ================== ПРОВЕРКА ОБНОВЛЕНИЙ ================== */
checkUpdates.addEventListener('click', async () => {
  checkUpdates.disabled = true;
  checkUpdates.innerHTML = '<span class="icon">⏳</span><span class="label">Проверяю...</span>';

  try {
    const res = await fetch(CONFIG.updateUrl + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('Нет ответа');
    const data = await res.json();
    const hasUpdate = compareVersions(data.version, CONFIG.currentVersion) > 0;
    showUpdateModal(data, hasUpdate);
  } catch (e) {
    showUpdateModal(null, false, 'Не удалось проверить обновления. Проверь соединение.');
  } finally {
    checkUpdates.disabled = false;
    checkUpdates.innerHTML = '<span class="icon">🔄</span><span class="label">Проверить обновления</span>';
  }
});

function compareVersions(a, b) {
  const pa = a.split('.').map(Number);
  const pb = b.split('.').map(Number);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const na = pa[i] || 0, nb = pb[i] || 0;
    if (na > nb) return 1;
    if (na < nb) return -1;
  }
  return 0;
}

function showUpdateModal(data, hasUpdate, error) {
  updateOverlay.classList.add('show');
  if (error) {
    updateModalContent.innerHTML = `
      <h3>⚠️ Ошибка</h3>
      <p>${error}</p>
      <div class="buttons">
        <button class="btn-skip" onclick="document.getElementById('updateOverlay').classList.remove('show')">Закрыть</button>
      </div>
    `;
    return;
  }
  if (hasUpdate) {
    updateModalContent.innerHTML = `
      <h3>🎉 Доступно обновление!</h3>
      <div class="version-info">
        Текущая: <b>v${CONFIG.currentVersion}</b><br>
        Новая: <b>v${data.version}</b>
      </div>
      <p>${data.notes || 'Что нового — не указано'}</p>
      <div class="buttons">
        <button class="btn-download" id="doDownload">📥 Скачать</button>
        <button class="btn-skip" onclick="document.getElementById('updateOverlay').classList.remove('show')">Позже</button>
      </div>
    `;
    document.getElementById('doDownload').addEventListener('click', () => {
      if (data.url) window.open(data.url, '_blank');
    });
  } else {
    updateModalContent.innerHTML = `
      <h3>✅ Обновлений нет</h3>
      <div class="version-info">
        Установлена последняя версия:<br><b>v${CONFIG.currentVersion}</b>
      </div>
      <p>Ты используешь самую свежую версию приложения.</p>
      <div class="buttons">
        <button class="btn-skip" onclick="document.getElementById('updateOverlay').classList.remove('show')">Ок</button>
      </div>
    `;
  }
}

/* ================== Рулетка ================== */
const wheel = document.getElementById('wheel');
const wctx = wheel.getContext('2d');
const SIZE = wheel.width;
const CX = SIZE / 2, CY = SIZE / 2;
const RADIUS = SIZE / 2 - 6;

const SECTORS = [
  { key:'balls',  label:'🔵', multiplier:1.5, color1:'#1e5fd0', color2:'#3a7bff', weight:30 },
  { key:'money',  label:'💰', multiplier:2,   color1:'#c98a10', color2:'#ffd54a', weight:25 },
  { key:'diamond',label:'💎', multiplier:5,   color1:'#0aa5b8', color2:'#4cf0ff', weight:10 },
  { key:'skull',  label:'💀', multiplier:0,   color1:'#5a0a0a', color2:'#c02525', weight:20 },
  { key:'x2',     label:'✖2', multiplier:2,   color1:'#5a2a8a', color2:'#a060ff', weight:10 },
  { key:'jackpot',label:'🏆', multiplier:10,  color1:'#b8860b', color2:'#ffe066', weight:5 },
];

const totalWeight = SECTORS.reduce((s,x) => s + x.weight, 0);
let acc = 0;
for (const s of SECTORS) {
  s.startAngle = (acc / totalWeight) * Math.PI * 2;
  acc += s.weight;
  s.endAngle = (acc / totalWeight) * Math.PI * 2;
}

function drawWheel() {
  wctx.clearRect(0, 0, SIZE, SIZE);
  wctx.beginPath();
  wctx.arc(CX, CY, RADIUS + 4, 0, Math.PI * 2);
  wctx.fillStyle = '#0a0a1a';
  wctx.fill();
  wctx.lineWidth = 4;
  wctx.strokeStyle = '#ffd54a';
  wctx.shadowBlur = 25;
  wctx.shadowColor = 'rgba(255,200,60,0.9)';
  wctx.stroke();
  wctx.shadowBlur = 0;

  for (const s of SECTORS) {
    wctx.beginPath();
    wctx.moveTo(CX, CY);
    wctx.arc(CX, CY, RADIUS, s.startAngle, s.endAngle);
    wctx.closePath();
    const mid = (s.startAngle + s.endAngle) / 2;
    const gx = CX + Math.cos(mid) * RADIUS * 0.7;
    const gy = CY + Math.sin(mid) * RADIUS * 0.7;
    const grad = wctx.createRadialGradient(CX, CY, 10, gx, gy, RADIUS);
    grad.addColorStop(0, s.color2);
    grad.addColorStop(1, s.color1);
    wctx.fillStyle = grad;
    wctx.fill();
    wctx.lineWidth = 2;
    wctx.strokeStyle = 'rgba(255,255,255,0.25)';
    wctx.stroke();
    wctx.save();
    wctx.translate(CX, CY);
    wctx.rotate(mid);
    wctx.textAlign = 'center';
    wctx.textBaseline = 'middle';
    wctx.font = `${s.key === 'jackpot' ? 32 : 40}px serif`;
    wctx.fillStyle = '#fff';
    wctx.shadowBlur = 12;
    wctx.shadowColor = 'rgba(0,0,0,0.9)';
    wctx.fillText(s.label, RADIUS * 0.72, 0);
    wctx.restore();
  }
  wctx.beginPath();
  wctx.arc(CX, CY, 55, 0, Math.PI * 2);
  wctx.fillStyle = '#0a0a1a';
  wctx.fill();
  wctx.lineWidth = 3;
  wctx.strokeStyle = '#ffd54a';
  wctx.stroke();
}
drawWheel();

function pickSector() {
  const r = Math.random() * totalWeight;
  let sum = 0;
  for (const s of SECTORS) { sum += s.weight; if (r <= sum) return s; }
  return SECTORS[0];
}

document.querySelectorAll('.bet-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (spinning) return;
    bet = +btn.dataset.bet;
    document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

spinBtn.addEventListener('click', () => {
  if (spinning) return;
  if (balance < bet) { showResult('Не хватает денег!', '#ff5566'); return; }

  spinning = true;
  spinBtn.disabled = true;
  balance -= bet;
  updateBalance();

  const sector = pickSector();
  const mid = (sector.startAngle + sector.endAngle) / 2;
  const target = -Math.PI / 2 - mid;
  const sectorSize = sector.endAngle - sector.startAngle;
  const jitter = (Math.random() - 0.5) * sectorSize * 0.7;
  const spins = 5 + Math.floor(Math.random() * 3);
  const fullSpins = spins * Math.PI * 2;

  const current = ((currentRotation % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
  const targetNorm = ((target + jitter) % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
  let delta = targetNorm - current;
  if (delta < 0) delta += Math.PI * 2;

  currentRotation += fullSpins + delta;
  wheel.style.transform = `rotate(${currentRotation}rad)`;
  setTimeout(() => onSpinEnd(sector), 4600);
});

function onSpinEnd(sector) {
  spinning = false;
  spinBtn.disabled = false;

  let multiplier = sector.multiplier;
  if (visual.luck > 0 && sector.key !== 'skull') multiplier *= (1 + visual.luck);

  const win = Math.round(bet * multiplier);
  const cx = W / 2, cy = H / 2;

  if (sector.key === 'balls') {
    for (let i = 0; i < 200; i++) particles.push(new Particle(cx, cy, true));
    for (let i = 0; i < 80; i++) particles.push(new Particle(cx, cy, true, Math.random() * 60 + 190));
  } else if (sector.key === 'money') {
    for (let i = 0; i < 50; i++) coins.push(new Coin());
  } else if (sector.key === 'diamond') {
    for (let i = 0; i < 100; i++) particles.push(new Particle(cx, cy, true, 180 + Math.random() * 30));
    for (let i = 0; i < 20; i++) coins.push(new Coin());
  } else if (sector.key === 'x2') {
    for (let i = 0; i < 150; i++) particles.push(new Particle(cx, cy, true, 270 + Math.random() * 40));
  } else if (sector.key === 'jackpot') {
    for (let i = 0; i < 400; i++) particles.push(new Particle(cx, cy, true, Math.random() * 360));
    for (let i = 0; i < 120; i++) coins.push(new Coin());
  } else if (sector.key === 'skull') {
    for (let i = 0; i < 100; i++) particles.push(new Particle(cx, cy, true, Math.random() * 15));
  }

  while (particles.length > visual.maxParticles) {
    const free = particles.find(p => !p.target);
    if (free) particles.splice(particles.indexOf(free), 1);
    else break;
  }

  if (win > 0) {
    balance += win;
    updateBalance();
    showResult(`+$${win.toLocaleString('ru-RU')}`, '#ffd54a');
  } else {
    showResult(`−$${bet.toLocaleString('ru-RU')} 💀`, '#ff4444');
  }
}

function showResult(text, color) {
  resultEl.textContent = text;
  resultEl.style.color = color;
  resultEl.classList.remove('show');
  void resultEl.offsetWidth;
  resultEl.classList.add('show');
}

/* ================== Магазин ================== */
function renderShop() {
  shopGrid.innerHTML = '';
  CONSTELLATIONS.forEach(c => {
    const owned = ownedConstellations.has(c.id);
    const canAfford = balance >= c.price;

    const card = document.createElement('div');
    card.className = 'card' + (owned ? ' owned' : '');

    card.innerHTML = `
      <div class="card-preview"><canvas width="300" height="150"></canvas></div>
      <div class="card-name" style="color:${c.color}">${c.name}</div>
      <div class="card-latin">${c.latin}</div>
      <div class="card-desc">${c.desc}</div>
      <div class="card-bonus">${c.bonus}</div>
      <div class="card-price">$${c.price.toLocaleString('ru-RU')}</div>
      <button class="buy-btn ${owned ? 'owned-btn' : ''}" ${owned ? 'disabled' : (canAfford ? '' : 'disabled')}>
        ${owned ? '✓ На небе' : (canAfford ? 'Купить' : 'Не хватает')}
      </button>
    `;

    const previewCanvas = card.querySelector('canvas');
    drawPreview(previewCanvas, c);

    if (!owned) {
      const btn = card.querySelector('.buy-btn');
      btn.addEventListener('click', () => buyConstellation(c));
    }

    shopGrid.appendChild(card);
  });
}

function drawPreview(canvas, c) {
  const pctx = canvas.getContext('2d');
  const pw = canvas.width, ph = canvas.height;
  pctx.clearRect(0, 0, pw, ph);

  for (let i = 0; i < 25; i++) {
    pctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.35 + 0.1})`;
    pctx.beginPath();
    pctx.arc(Math.random() * pw, Math.random() * ph, Math.random() * 0.8 + 0.3, 0, Math.PI * 2);
    pctx.fill();
  }

  const size = Math.min(pw, ph) * 1.1;
  const ox = pw / 2;
  const oy = ph / 2;

  pctx.strokeStyle = c.lineColor;
  pctx.lineWidth = 1.2;
  pctx.shadowBlur = 6;
  pctx.shadowColor = c.color;
  pctx.globalAlpha = 0.85;
  for (const [a, b] of c.links) {
    const s1 = c.stars[a], s2 = c.stars[b];
    pctx.beginPath();
    pctx.moveTo(ox + (s1.x - 0.5) * size, oy + (s1.y - 0.5) * size);
    pctx.lineTo(ox + (s2.x - 0.5) * size, oy + (s2.y - 0.5) * size);
    pctx.stroke();
  }
  pctx.globalAlpha = 1;
  pctx.shadowBlur = 0;

  for (const s of c.stars) {
    const sx = ox + (s.x - 0.5) * size;
    const sy = oy + (s.y - 0.5) * size;
    const sr = s.r * 0.9;

    const g = pctx.createRadialGradient(sx, sy, 0, sx, sy, sr * 5);
    g.addColorStop(0, c.starColor);
    g.addColorStop(0.3, c.color + '90');
    g.addColorStop(1, 'transparent');
    pctx.fillStyle = g;
    pctx.beginPath();
    pctx.arc(sx, sy, sr * 5, 0, Math.PI * 2);
    pctx.fill();

    pctx.beginPath();
    pctx.arc(sx, sy, sr, 0, Math.PI * 2);
    pctx.fillStyle = '#fff';
    pctx.shadowBlur = 10;
    pctx.shadowColor = c.starColor;
    pctx.fill();
    pctx.shadowBlur = 0;
  }
}

function buyConstellation(c) {
  if (ownedConstellations.has(c.id)) return;
  if (balance < c.price) return;

  balance -= c.price;
  ownedConstellations.add(c.id);

  if (c.speedBoost) visual.speedBoost = c.speedBoost;
  if (c.magnetBoost) visual.magnetBoost = c.magnetBoost;
  if (c.maxParticles) visual.maxParticles = c.maxParticles;
  if (c.trail) visual.trail = true;
  if (c.hueOverride !== undefined) visual.hueOverride = c.hueOverride;
  if (c.luck !== undefined) visual.luck = Math.max(visual.luck, c.luck);

  const obj = new ParticleConstellation(c);
  constellationObjects.push(obj);

  updateBalance();
  updateStats();
  shopOverlay.classList.remove('show');

  const cx = W / 2, cy = H / 2;
  for (let i = 0; i < 200; i++) {
    particles.push(new Particle(cx, cy, true, hexToHue(c.color) + (Math.random() - 0.5) * 40));
  }

  showResult(`${c.name}!`, c.color);
  floater(`−$${c.price.toLocaleString('ru-RU')}`, '#ff4444');
}
